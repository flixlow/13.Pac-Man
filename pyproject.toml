[project]
name = "pac-man"
version = "0.1.0"
description = "Pac-Man Game with pygame"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mazegenerator",
    "pydantic>=2.13.5",
    "pygame>=2.6.1",
    "flake8",
    "mypy"
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[mypy]
ignore_missing_imports = true